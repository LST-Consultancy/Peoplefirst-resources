services:
  app:
    build: .
    image: peoplefirst-staffing:latest
    container_name: peoplefirst-staffing
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL}
    volumes:
      - peoplefirst-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.peoplefirst.rule=Host(`peoplefirstresources.com`) || Host(`www.peoplefirstresources.com`)
      - traefik.http.routers.peoplefirst.entrypoints=websecure
      - traefik.http.routers.peoplefirst.tls.certresolver=letsencrypt
      - traefik.http.services.peoplefirst.loadbalancer.server.port=3000
    networks:
      - default
      - traefik-proxy

networks:
  traefik-proxy:
    external: true

volumes:
  peoplefirst-data:
