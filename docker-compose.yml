services:
  app:
    build: .
    image: peoplefirst-staffing:latest
    container_name: peoplefirst-staffing
    restart: unless-stopped
    ports:
      - "3008:3000"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL}
    volumes:
      - peoplefirst-data:/app/data

volumes:
  peoplefirst-data:
